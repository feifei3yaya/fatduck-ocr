name: 问题反馈
description: 报告一个可以复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认已升级到最新版本，并搜索过现有 Issue。
        **请勿上传真实单号、姓名、电话、地址等个人信息；截图请打码。**
  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 在「关于 · 隐私」中可以看到
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: Windows 11 23H2 64 位
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 什么文件、点了哪些按钮、发生了什么
      placeholder: |
        1. 拖入一张表格照片
        2. 选择「图片转 Excel」
        3. 点击开始转换
        4. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 位于 `%APPDATA%\肥鸭文档转换\logs`，请粘贴最新日志中相关部分
      render: text
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、样例文件说明等
