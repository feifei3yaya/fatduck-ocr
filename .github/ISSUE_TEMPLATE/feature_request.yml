name: 功能建议
description: 提出一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么事情时遇到了不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你考虑过的替代做法
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
